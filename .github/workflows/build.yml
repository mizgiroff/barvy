name: Build Barvy APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version
        id: ver
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        run: gradle test

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Prepare versioned APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "barvy_v${{ steps.ver.outputs.version }}.apk"
          ls -lh "barvy_v${{ steps.ver.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: barvy_v${{ steps.ver.outputs.version }}
          path: barvy_v${{ steps.ver.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Barvy v${{ steps.ver.outputs.version }}
          body: |
            Barvy v${{ steps.ver.outputs.version }} (Lviv & Zakarpattia Oblasts).
            - Bilingual UI: Ukrainian & English
            - Two-level Oblast & City catalog filter (596 landmarks)
            - Geofencing + Driving Mode (Foreground Service) for instant auto-switch on the road
            - Built-in Permissions & Battery setup guide
          files: barvy_v${{ steps.ver.outputs.version }}.apk
