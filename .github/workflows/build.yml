name: Build Barvy APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unpack latest barvy_v*.zip
        id: prep
        run: |
          ZIP_FILE=$(ls -1v barvy_v*.zip | tail -n 1)
          echo "Using archive: $ZIP_FILE"
          TAG="${ZIP_FILE#barvy_}"
          TAG="${TAG%.zip}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=barvy_${TAG}.apk" >> "$GITHUB_OUTPUT"
          mkdir -p src_build
          unzip -oq "$ZIP_FILE" -d src_build
          VER=$(grep -E 'versionCode\s*=' src_build/app/build.gradle.kts | head -n 1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          YYMMDD=$(date +%y%m%d)
          echo "base_name=Barvy_v${VER}_${YYMMDD}" >> "$GITHUB_OUTPUT"
          echo "apk_name=Barvy_v${VER}_${YYMMDD}.apk" >> "$GITHUB_OUTPUT"
          echo "zip_name=Barvy_v${VER}_${YYMMDD}.zip" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}_${YYMMDD}" >> "$GITHUB_OUTPUT"
          echo "release_name=Barvy v${VER}_${YYMMDD}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        working-directory: src_build
        run: gradle test

      - name: Build Debug APK
        working-directory: src_build
        run: gradle assembleDebug

      - name: Prepare versioned APK
        run: |
          cp src_build/app/build/outputs/apk/debug/app-debug.apk "${{ steps.prep.outputs.apk_name }}"
          zip -j "${{ steps.prep.outputs.zip_name }}" "${{ steps.prep.outputs.apk_name }}"
          ls -lh "${{ steps.prep.outputs.apk_name }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.base_name }}
          path: ${{ steps.prep.outputs.zip_name }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: Barvy ${{ steps.prep.outputs.tag }}
          body: |
            Automatic build from ${{ steps.prep.outputs.apk_name }}.
          files: ${{ steps.prep.outputs.zip_name }}
