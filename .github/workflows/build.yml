name: Build Barvy APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or unpack project
        id: proj
        run: |
          LATEST_ZIP=$(ls -v [Bb]arvy_v*.zip 2>/dev/null | tail -n 1 || true)
          if [ -n "$LATEST_ZIP" ]; then
            echo "Unpacking $LATEST_ZIP into src_build"
            rm -rf src_build
            mkdir -p src_build
            unzip -q "$LATEST_ZIP" -d src_build
            WORKDIR="src_build"
          else
            WORKDIR="."
          fi
          VERSION=$(grep 'versionName' "$WORKDIR/app/build.gradle.kts" | sed -E 's/.*"([^"]+)".*/\1/')
          echo "workdir=$WORKDIR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using workdir=$WORKDIR, version=$VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        working-directory: ${{ steps.proj.outputs.workdir }}
        run: gradle test

      - name: Build Release APK
        working-directory: ${{ steps.proj.outputs.workdir }}
        run: gradle assembleRelease

      - name: Prepare versioned APK
        run: |
          cp "${{ steps.proj.outputs.workdir }}/app/build/outputs/apk/release/app-release.apk" "barvy_v${{ steps.proj.outputs.version }}.apk"
          ls -lh "barvy_v${{ steps.proj.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: barvy_v${{ steps.proj.outputs.version }}_apk
          path: barvy_v${{ steps.proj.outputs.version }}.apk
          retention-days: 3
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.proj.outputs.version }}
          name: Barvy v${{ steps.proj.outputs.version }}
          body: |
            Barvy v${{ steps.proj.outputs.version }} (Lviv & Zakarpattia Oblasts).
            - Bilingual UI: Ukrainian & English
            - Two-level Oblast & City catalog filter (602 landmarks)
            - Geofencing + Driving Mode (Foreground Service) for instant auto-switch on the road
            - Built-in Permissions & Battery setup guide
          files: barvy_v${{ steps.proj.outputs.version }}.apk
