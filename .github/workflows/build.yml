name: Build Barvy APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project zip if present
        run: |
          if [ -f barvy_v24_26.11.19.zip ]; then
            unzip -o barvy_v24_26.11.19.zip -x ".github/*"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        run: gradle test

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Prepare versioned APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk barvy_v24_26.11.19.apk
          ls -lh barvy_v24_26.11.19.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: barvy_v24_26.11.19
          path: barvy_v24_26.11.19.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v24_26.11.19
          name: Барви v24_26.11.19
          body: |
            Автоматическая сборка приложения Барви (Львов и область).
          files: barvy_v24_26.11.19.apk
